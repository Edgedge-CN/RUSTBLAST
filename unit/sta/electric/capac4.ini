[graphics]
scaleImagesTo:60
image_wreak:capw.png
image:qdCap.png
image_shadow:AUTO
shadowOffsetX:1
shadowOffsetY:1
[ai]
buildPriority:0.003
noneInBaseExtraPriority:0.003
noneGlobalExtraPriority:0.02
[movement]
movementType:HOVER
[hiddenAction_dead]
