[core]
name:Scell
displayText:火力发电机
displayDescription:-廉价且占地极小\n-基础发电设施\n-[烟尘]chance:2%/5s(WIP)\n-供给6单位的电力,燃烧1硫/s
class:CustomUnitMetadata
price:iron=120,红宝石=100
maxHp:800
shieldDisplayOnlyDeflection:true
mass:1000
footprint:0,0,0,0
constructionFootprint:0,0,0,0
generation_resources:电力=6,S=-1
generation_active:if self.resource.电力 < self.resource.cap and self.resource.S > 1
techLevel:1
buildSpeed:6.6s
availableInDemo:true
radius:10
isBuilding:true
explodeTypeOnDeath:building
explodeOnDeathGroundCollision:false
explodeOnDeath:false
tags:sta,ele
unitsSpawnedOnDeath:Eboom
[attack]
canAttack:false
[graphics]
scaleImagesTo:20
image:genS.png
image_shadow:AUTO
shadowOffsetX:1
shadowOffsetY:1
[ai]
buildPriority:0.001
noneInBaseExtraPriority:0.006
noneGlobalExtraPriority:0.005
maxEachBase:10
[movement]
movementType:HOVER

[effect_dust]
delayedStartTimerRandom:10
image:ROOT:/unit/sta/gen/smoke.png
life:40
scaleFrom:0.6
scaleTo:0.3
priority:critical
alpha:1
xSpeedAbsoluteRandom:0.2
ySpeedAbsoluteRandom:0.2
hSpeedRandom:0.5
hSpeed:1.3
dirSpeedRandom:3
dirSpeed:10
[hiddenAction_init]
autoTriggerOnEvent:created
resetCustomTimer:true
[animation_dust]
onActions:idle
effect_1s:{x:0,y:1,name:dust*1}
[decal_glow]
alpha:select(self.resource.S>1,0.75-sin(self.customTimer*512)/4,0)
imageScale:0.6
image:genSGlow.png